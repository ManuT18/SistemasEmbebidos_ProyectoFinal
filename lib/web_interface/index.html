<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Modem FT8</title>
    <style>
        body { background:#111; color:#0f0; font-family:monospace; text-align:center; }
        #container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; padding: 20px; }
        #log { border:1px solid #333; height:300px; width: 60%; overflow:auto; padding:10px; text-align:left; background:#000; }
        #controls { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 10px 20px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0a0; }
        
        /* Login Screen Styles */
        #login-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 50px; }
        input { padding: 10px; background: #222; color: #0f0; border: 1px solid #0f0; text-transform: uppercase; }
        .hidden { display: none !important; }
        #logout-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: red;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sleep-btn {
            background: #007bff; /* Blue */
            color: white;
        }
        
        /* Toggle Switch Styles */
        .switch-container {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: bold;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }
        input:checked + .slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }
        /* Icons inside slider */
        .slider-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }
        .icon-left { left: 8px; }
        .icon-right { right: 8px; }

        /* Resize Clock */
        #clock-display { font-size: 1.2em; margin-top: 40px; }

    </style>
</head>
<body>
    <h1>📡 Monitor FT8</h1>
    
    <!-- Login Screen -->
    <div id="login-screen">
        <h2>Identificación de Operador</h2>
        <input type="text" id="callsign" placeholder="Señal Distintiva (ej. LU7AA)">
        <input type="text" id="grid" placeholder="Grid Locator (ej. GF05)">
        <button onclick="login()">INICIAR</button>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="hidden">
        <button id="logout-btn" onclick="logout()">X</button>
        
        <!-- Toggle Switch for Power Mode -->
        <div class="switch-container">
            <span id="mode-icon">💤</span>
            <label class="switch">
                <input type="checkbox" id="sleep-toggle" onclick="toggleSleep()" checked>
                <span class="slider round"></span>
            </label>
            <span id="mode-icon-active">⚡</span>
        </div>

        <h2 id='clock-display'>HORA ACTUAL (UTC): --:--:--</h2>
        <div id='container'>
            <div id='log'>Esperando conexión...</div>
            <div id='controls'>
                <button onclick='toggleLed()'>💡 Toggle LED</button>
                <button onclick='getCallsign()'>📡 Consultar Señal</button>
                <button onclick='getGrid()'>🗺️ Consultar Grid</button>
            </div>
        </div>
    </div>

    <script>
        var socket = new WebSocket('ws://' + location.hostname + '/ws');
        var isSleepMode = false;
        
        socket.onopen = function() { 
            document.getElementById('log').innerHTML = '<p>✅ Conectado al ESP32</p>'; 
            syncTime();
            
            // Auto-login
            var savedCall = localStorage.getItem('callsign');
            var savedGrid = localStorage.getItem('grid');
            if (savedCall && savedGrid) {
                socket.send("LOGIN:" + savedCall + ":" + savedGrid);
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
            }
        };
        
        function logToUI(msg) {
            var log = document.getElementById('log');
            log.innerHTML += '<p>' + msg + '</p>';
            log.scrollTop = log.scrollHeight;
        }

        socket.onmessage = function(event) { 
            logToUI(event.data);
        };

        function login() {
            var call = document.getElementById('callsign').value.toUpperCase().trim();
            var grid = document.getElementById('grid').value.toUpperCase().trim();

            if (call === "" || grid === "") {
                alert("Por favor complete ambos campos.");
                return;
            }

            // Save session
            localStorage.setItem('callsign', call);
            localStorage.setItem('grid', grid);

            // Send login data to ESP32
            socket.send("LOGIN:" + call + ":" + grid);

            // Switch views
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('callsign');
            localStorage.removeItem('grid');
            location.reload();
        }

        function toggleLed() {
            socket.send('TOGGLE_LED');
        }

        function toggleSleep() {
            var toggle = document.getElementById('sleep-toggle');
            // Logic: 
            // Checked (Right) = Performance Mode (⚡)
            // Unchecked (Left) = Sleep Mode (💤)
            
            // We send TOGGLE_SLEEP to ESP32 which flips its state.
            // Ideally we should have explicit ON/OFF commands, but TOGGLE works if synced.
            // Since we just clicked it, the state changed.
            socket.send('TOGGLE_SLEEP');
            
            if (toggle.checked) {
                // Now in Performance Mode
                // logToUI("⚡ Modo Rendimiento"); // ESP32 already sends log
            } else {
                // Now in Sleep Mode
                // logToUI("💤 Modo Ahorro");
            }
        }

        function getCallsign() {
            socket.send('GET_CALLSIGN');
        }

        function getGrid() {
            socket.send('GET_GRID');
        }

        function syncTime() {
            // Intentamos obtener hora de internet con un timeout corto (1s)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1000);

            fetch('https://worldtimeapi.org/api/ip', { signal: controller.signal })
                .then(response => response.json())
                .then(data => {
                    var now = data.unixtime;
                    socket.send('SYNC_TIME:' + now);
                    logToUI("🌐 Sincronizado vía Internet (API)");
                })
                .catch(error => {
                    // Fallback inmediato a la hora del dispositivo (que asumimos correcta por 4G/LTE)
                    var now = Math.floor(Date.now() / 1000);
                    socket.send('SYNC_TIME:' + now);
                    logToUI("📱 Sincronizado (Hora del Dispositivo Cliente)");
                });
        }

        function updateClock() {
            var now = new Date();
            var hours = String(now.getUTCHours()).padStart(2, '0');
            var minutes = String(now.getUTCMinutes()).padStart(2, '0');
            var seconds = String(now.getUTCSeconds()).padStart(2, '0');
            var millis = String(Math.floor(now.getUTCMilliseconds() / 10)).padStart(2, '0');
            
            document.getElementById('clock-display').innerText = 
                "HORA ACTUAL (UTC): " + hours + ":" + minutes + ":" + seconds + "." + millis;
        }

        // Sincronizar tiempo cada 60 segundos
        setInterval(syncTime, 60000);
        // Actualizar reloj localmente cada 50ms
        setInterval(updateClock, 50);
    </script>
</body>
</html>
